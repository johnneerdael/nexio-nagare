<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexio Nagare — Setup</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kaisei+Tokumin:wght@400;700;800&family=Space+Mono&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Kaisei Tokumin", serif;
            background-color: #050505;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .bg-layer {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(66, 165, 245, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(30, 136, 229, 0.15), transparent 25%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.05), transparent 50%);
            z-index: -2;
            pointer-events: none;
            will-change: transform;
            animation: backgroundShiftGPU 15s ease-in-out infinite alternate;
        }

        @keyframes backgroundShiftGPU {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-10%, 0, 0); }
        }

        .glass-card {
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 1), inset 0 0 20px rgba(66, 165, 245, 0.02);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            animation: float 6s ease-in-out infinite;
            margin-top: auto;
            margin-bottom: auto;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateZ(0); }
            50% { transform: translateY(-12px) translateZ(0); }
        }

        @media (max-width: 768px) {
            .glass-card { animation: none; }
            .bg-layer { animation: none; }
        }

        .input-glass {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(66, 165, 245, 0.15);
            transition: all 0.2s ease;
        }
        .input-glass:focus {
            border-color: rgba(66, 165, 245, 0.5);
            box-shadow: 0 0 0 1px rgba(66, 165, 245, 0.4);
        }

        .glass-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border: 1px solid rgba(66, 165, 245, 0.4);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.6);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }
        .glass-checkbox:checked {
            background: rgba(66, 165, 245, 0.8);
            border-color: rgba(66, 165, 245, 1);
        }
        .glass-checkbox:checked::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-bottom: 2px solid white;
            border-right: 2px solid white;
            transform: rotate(45deg) translate(-1px, -2px);
            width: 5px; height: 9px;
        }

        .copy-box::-webkit-scrollbar { height: 4px; }
        .copy-box::-webkit-scrollbar-thumb { background: rgba(66, 165, 245, 0.5); border-radius: 4px; }

        .brand-logo {
            width: min(100%, 360px);
            max-height: 200px;
            object-fit: contain;
            border-radius: 22%;
            filter: drop-shadow(0 0 24px rgba(66, 165, 245, 0.55));
        }

        .bg-logo-container {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
        }

        .bg-logo {
            width: 80%;
            max-width: 800px;
            opacity: 0.05;
            transform: rotate(-5deg);
            -webkit-mask-image: radial-gradient(circle, black 30%, transparent 70%);
            mask-image: radial-gradient(circle, black 30%, transparent 70%);
            mix-blend-mode: screen;
        }

        .pill {
            font-family: "Space Mono", monospace;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            padding: 6px 10px;
            color: #9aa3b2;
            transition: all 0.2s ease;
        }
        .peer:checked + .pill {
            background: rgba(66, 165, 245, 0.2);
            color: rgb(66, 165, 245);
            border-color: rgba(66, 165, 245, 0.5);
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen flex flex-col p-4 relative border-t-2 border-blue-500/10">

    <div class="bg-layer"></div>

    <div class="bg-logo-container">
        <img src="/nexio-nagare.png" class="bg-logo" alt="">
    </div>

    <div class="glass-card p-8 md:p-12 rounded-[2.5rem] max-w-3xl w-full relative z-10 mx-auto my-8">

        <div class="mb-10 text-center">
            <img src="/nexio-nagare.png" class="brand-logo mx-auto" alt="Nexio Nagare">
            <div class="mt-6 border-t border-white/5 w-1/3 mx-auto pt-2 opacity-30"></div>
        </div>

        <div class="space-y-10">

            <!-- Providers -->
            <section>
                <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest mb-4 px-2">Stream Providers</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 px-2">
                    <label class="cursor-pointer">
                        <input type="checkbox" class="peer hidden provider-cb" value="onetwothreeanime" checked>
                        <div class="pill text-center py-3 leading-tight">
                            <span class="block text-blue-300 text-[12px] font-bold tracking-widest">123anime</span>
                            <span class="block text-[9px] mt-1 opacity-60">123anime.la · sub/dub</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" class="peer hidden provider-cb" value="anizone" checked>
                        <div class="pill text-center py-3 leading-tight">
                            <span class="block text-blue-300 text-[12px] font-bold tracking-widest">Anizone</span>
                            <span class="block text-[9px] mt-1 opacity-60">anizone.to · subbed + tracks</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" class="peer hidden provider-cb" value="animenosub" checked>
                        <div class="pill text-center py-3 leading-tight">
                            <span class="block text-blue-300 text-[12px] font-bold tracking-widest">Animenosub</span>
                            <span class="block text-[9px] mt-1 opacity-60">animenosub.to · airing focus</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" class="peer hidden provider-cb" value="animepahe" checked>
                        <div class="pill text-center py-3 leading-tight">
                            <span class="block text-blue-300 text-[12px] font-bold tracking-widest">AnimePahe</span>
                            <span class="block text-[9px] mt-1 opacity-60">animepahe.pw · Kwik / sub+dub</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="checkbox" class="peer hidden provider-cb" value="gojo" checked>
                        <div class="pill text-center py-3 leading-tight">
                            <span class="block text-blue-300 text-[12px] font-bold tracking-widest">Gojo</span>
                            <span class="block text-[9px] mt-1 opacity-60">animetsu.live · AniList-ID native</span>
                        </div>
                    </label>
                </div>
            </section>

            <!-- Track preference -->
            <section class="pt-2 border-t border-white/5">
                <label class="flex items-start space-x-4 cursor-pointer group px-2 mt-4">
                    <input type="checkbox" id="preferDub" class="glass-checkbox mt-1">
                    <div class="flex flex-col text-left">
                        <span class="text-[12px] font-mono text-blue-400 font-bold uppercase tracking-widest">Prefer Dub</span>
                        <span class="text-[10px] font-mono text-gray-500 mt-1 leading-relaxed">When a provider catalogs both versions, score the dub higher. Sub is the default.</span>
                    </div>
                </label>
            </section>

            <!-- Resolutions -->
            <section class="pt-2 border-t border-white/5">
                <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest mt-4 mb-3 px-2">Resolution Filter</p>
                <div class="flex flex-wrap gap-2 px-2" id="resolution-grid">
                    <label class="cursor-pointer"><input type="checkbox" class="peer hidden res-cb" value="4K" checked><div class="pill">4K</div></label>
                    <label class="cursor-pointer"><input type="checkbox" class="peer hidden res-cb" value="1080p" checked><div class="pill">1080p</div></label>
                    <label class="cursor-pointer"><input type="checkbox" class="peer hidden res-cb" value="720p" checked><div class="pill">720p</div></label>
                    <label class="cursor-pointer"><input type="checkbox" class="peer hidden res-cb" value="480p" checked><div class="pill">480p</div></label>
                    <label class="cursor-pointer"><input type="checkbox" class="peer hidden res-cb" value="auto" checked><div class="pill">Auto / unknown</div></label>
                </div>
            </section>

            <!-- Title preference -->
            <section class="pt-2 border-t border-white/5">
                <label class="flex items-center space-x-4 cursor-pointer group px-2 mt-4">
                    <input type="checkbox" id="useEnglishTitles" class="glass-checkbox" checked>
                    <span class="text-[12px] font-mono text-blue-400 font-bold uppercase tracking-widest">Use English titles</span>
                </label>
            </section>

            <!-- Catalogs -->
            <section class="pt-2 border-t border-white/5">
                <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest mt-4 mb-3 px-2">Catalog visibility</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 px-2">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="showSeasonalSeries" class="glass-checkbox" checked>
                        <span class="text-[11px] font-mono text-gray-300">Current season</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="showAiringSeries" class="glass-checkbox" checked>
                        <span class="text-[11px] font-mono text-gray-300">Currently airing</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="showTrendingSeries" class="glass-checkbox" checked>
                        <span class="text-[11px] font-mono text-gray-300">Trending series</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="showTopSeries" class="glass-checkbox" checked>
                        <span class="text-[11px] font-mono text-gray-300">Top-rated series</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="showTrendingMovies" class="glass-checkbox" checked>
                        <span class="text-[11px] font-mono text-gray-300">Trending movies</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="showTopMovies" class="glass-checkbox" checked>
                        <span class="text-[11px] font-mono text-gray-300">Top-rated movies</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="showSearchCatalog" class="glass-checkbox" checked>
                        <span class="text-[11px] font-mono text-gray-300">Search provider</span>
                    </label>
                </div>
            </section>

            <!-- Install -->
            <section class="pt-2 border-t border-white/5">
                <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest mt-4 mb-3 px-2">Install</p>

                <div class="flex items-stretch gap-2 px-2">
                    <input id="manifestUrlDisplay" type="text" readonly
                        class="copy-box input-glass rounded-xl px-4 py-3 text-blue-300 outline-none font-mono text-xs flex-1">
                    <button id="copyBtn" type="button" onclick="copyManifest()" title="Copy manifest URL"
                        class="bg-black/40 border border-white/10 hover:border-blue-500/50 rounded-xl px-4 py-3 text-blue-300 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </button>
                </div>

                <div class="flex flex-wrap gap-3 px-2 mt-4">
                    <a id="installStremio" target="_self"
                        class="bg-blue-500/20 border border-blue-500/50 hover:bg-blue-500/40 rounded-xl px-4 py-3 text-blue-200 font-mono text-[11px] uppercase tracking-widest cursor-pointer">
                        Install in Stremio
                    </a>
                    <a id="installWeb" target="_blank" rel="noopener noreferrer"
                        class="bg-black/40 border border-white/10 hover:border-blue-500/50 rounded-xl px-4 py-3 text-gray-300 font-mono text-[11px] uppercase tracking-widest cursor-pointer">
                        Install via Web
                    </a>
                </div>
            </section>
        </div>
    </div>

    <script>
        function readProviders() {
            return Array.from(document.querySelectorAll(".provider-cb:checked")).map(cb => cb.value);
        }
        function readResolutions() {
            return Array.from(document.querySelectorAll(".res-cb:checked")).map(cb => cb.value);
        }
        function debounce(fn, wait) {
            let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); };
        }
        function buildPayload() {
            return {
                useEnglishTitles: document.getElementById("useEnglishTitles").checked,
                preferDub: document.getElementById("preferDub").checked,
                providers: readProviders(),
                resolutions: readResolutions(),
                showSeasonalSeries: document.getElementById("showSeasonalSeries").checked,
                showAiringSeries: document.getElementById("showAiringSeries").checked,
                showTrendingSeries: document.getElementById("showTrendingSeries").checked,
                showTopSeries: document.getElementById("showTopSeries").checked,
                showTrendingMovies: document.getElementById("showTrendingMovies").checked,
                showTopMovies: document.getElementById("showTopMovies").checked,
                showSearchCatalog: document.getElementById("showSearchCatalog").checked
            };
        }
        function toBase64Safe(str) {
            return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }
        function generateManifestUrl() {
            const payload = buildPayload();
            const encoded = toBase64Safe(JSON.stringify(payload));
            const configStr = encodeURIComponent(JSON.stringify({ NexioNagare: encoded }));

            let host = window.location.host;
            if (host.includes("localhost")) host = host.replace("localhost", "127.0.0.1");
            const protocol = window.location.protocol === "https:" ? "https://" : "http://";
            const manifestUrl = `${protocol}${host}/${configStr}/manifest.json`;

            document.getElementById("manifestUrlDisplay").value = manifestUrl;
            document.getElementById("installStremio").href = manifestUrl.replace(/^https?:\/\//, "stremio://");
            document.getElementById("installWeb").href = `https://web.stremio.com/#/addons?addon=${encodeURIComponent(manifestUrl)}`;
        }
        const refreshUrl = debounce(generateManifestUrl, 80);
        function copyManifest() {
            const t = document.getElementById("manifestUrlDisplay");
            t.select(); t.setSelectionRange(0, 99999);
            try { navigator.clipboard.writeText(t.value); } catch (e) { document.execCommand("copy"); }
            const btn = document.getElementById("copyBtn");
            const orig = btn.innerHTML;
            btn.innerHTML = '<svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            setTimeout(() => { btn.innerHTML = orig; }, 1500);
        }
        document.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", refreshUrl));
        generateManifestUrl();
    </script>
</body>
</html>
